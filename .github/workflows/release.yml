name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  goreleaser:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for changelog generation

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The published notes are the CHANGELOG section for this tag, so the file
      # and the release page cannot disagree. Generated-from-commits notes drop
      # docs:, test: and chore: work by config and cannot carry a reason or a
      # migration note. A missing or empty section fails here, before anything
      # is published: an empty release page is not obviously wrong to anyone
      # watching the job go green.
      - name: Extract release notes from CHANGELOG
        run: scripts/release-notes.sh "${GITHUB_REF_NAME}" > /tmp/release-notes.md

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # weft-releases is where users land from the tap and the install links, so
      # its README is this one at the released tag. Copying it by hand drifted
      # for months. Pre-release tags leave it on the last stable README.
      - name: Publish README to weft-releases
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          scripts/release-readme.sh "${GITHUB_REF_NAME}" > /tmp/README.md
          sha=$(gh api repos/jophira/weft-releases/contents/README.md --jq .sha)
          gh api -X PUT repos/jophira/weft-releases/contents/README.md \
            -f message="docs: sync README from weft ${GITHUB_REF_NAME}" \
            -f content="$(base64 -w0 /tmp/README.md)" \
            -f sha="$sha"
        env:
          GH_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN }}
